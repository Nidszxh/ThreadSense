services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: threadsense
      POSTGRES_PASSWORD: threadsense
      POSTGRES_DB: threadsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadsense -d threadsense"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
